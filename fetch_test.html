<!DOCTYPE html>
<html>
<body>
<textarea id="url" style="width:100%;height:40px">https://arch.b4k.dev/v/thread/743773860</textarea>
<button id="btn">Fetch</button>
<pre id="log">Ready</pre>
<script>
var log = document.getElementById('log');
function add(s) { log.textContent += '\n' + s; }

document.getElementById('btn').addEventListener('click', function() {
  var raw = document.getElementById('url').value;
  add('Raw: [' + raw + ']');
  var lines = raw.split('\n');
  add('Lines: ' + lines.length);
  for (var i = 0; i < lines.length; i++) {
    var u = lines[i].trim();
    add('Line ' + i + ': [' + u + '] len=' + u.length);
    if (!u) { add('  skipped empty'); continue; }

    var ffM = u.match(/^https?:\/\/([^/]+)\/(\w+)\/thread\/(\d+)/);
    add('  regex match: ' + (ffM ? 'YES' : 'NO'));
    if (ffM) {
      var apiUrl = 'https://' + ffM[1] + '/_/api/chan/thread/?board=' + ffM[2] + '&num=' + ffM[3];
      add('  API: ' + apiUrl);
      add('  Starting XHR...');

      var done = false;
      var xhr = new XMLHttpRequest();
      xhr.timeout = 15000;
      xhr.open('GET', apiUrl, true);
      xhr.onload = function() {
        if (done) return;
        done = true;
        add('  Status: ' + xhr.status + ' len=' + xhr.responseText.length);
        try {
          var obj = JSON.parse(xhr.responseText);
          var key = Object.keys(obj)[0];
          var td = obj[key];
          var postCount = Object.keys(td.posts).length;
          add('  Posts: ' + postCount);
          add('  SUCCESS');
        } catch(e) { add('  JSON parse error: ' + e.message); }
      };
      xhr.onerror = function() { if (!done) { done = true; add('  ERROR: network'); } };
      xhr.ontimeout = function() { if (!done) { done = true; add('  ERROR: timeout'); } };
      xhr.send();
    }
  }
});
</script>
</body>
</html>
